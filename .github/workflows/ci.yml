name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The client and storybook test projects run in headless Chromium. The runner image
      # already has its system libraries; --with-deps spent minutes on fonts from apt.
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # What the Worker bundle imports: cloudflare/_worker.js -> cloudflare-tmp/server.js -> output/server.
      # Unpack into .svelte-kit/ of a checkout of the same commit, then deploy without building.
      - uses: actions/upload-artifact@v7
        with:
          name: staging-build
          path: |
            .svelte-kit/cloudflare
            .svelte-kit/cloudflare-tmp
            .svelte-kit/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
